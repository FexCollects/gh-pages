	function update_pokemon_notes(prefix) {
		var label = document.getElementById(prefix + '_notes');

		var PID_val = document.getElementById(prefix + '_pid').value
		if (PID_val === "") {
			label.innerHTML = "";
			return;
		}
		var PID = Number("0x" + PID_val);
		if (isNaN(PID)) {
			label.innerHTML = "";
			return;
		}
		var nature = [
			"Hardy",
			"Lonely",
			"Brave",
			"Adamant",
			"Naughty",
			"Bold",
			"Docile",
			"Relaxed",
			"Impish",
			"Lax",
			"Timid",
			"Hasty",
			"Serious",
			"Jolly",
			"Naive",
			"Modest",
			"Mild",
			"Quiet",
			"Bashful",
			"Rash",
			"Calm",
			"Gentle",
			"Sassy",
			"Careful",
			"Quirky",
		][PID % 25]
		label.innerHTML = nature;

		var TID_val = document.getElementById(prefix + '_ot_tid').value
		var SID_val = document.getElementById(prefix + '_ot_sid').value
		if (TID_val === "" || SID_val === "") {
			return;
		}
		var TID = Number(TID_val);
		var SID = Number(SID_val);
		if (isNaN(TID) || isNaN(SID)) {
			return;
		}

		var PID_H = (PID & 0xFFFF0000) >> 16
		var PID_L = PID & 0x0000FFFF

		if (((TID ^ SID) ^ (PID_H ^ PID_L)) < 8) {
			label.innerHTML = "Shiny " + nature;
		}
	}

	function insert_options(select, options) {
		for (var i = 0; i < options.length; i++) {
			var option = options[i];
			var opt = document.createElement('option');
			opt.value = option;
			opt.innerHTML = option;
			select.appendChild(opt);
		}
	}
